# pgvector 확장이 미리 포함된 Postgres 16 이미지.
# 관계형(카드/혜택) + 벡터(약관 임베딩)를 한 DB에 저장하는 문서 아키텍처를 그대로 로컬 재현.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cardrag-db
    environment:
      POSTGRES_USER: cardrag
      POSTGRES_PASSWORD: cardrag
      POSTGRES_DB: cardrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardrag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
