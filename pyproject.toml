[project]
name = "card-rag"
version = "0.1.0"
description = "AICE 위치기반 카드혜택 추천 - 하이브리드 추천엔진(규칙 엔진 + RAG) 프로토타입"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "anthropic>=0.40",
    "cohere>=5.13",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "typer>=0.15",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
api = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.scripts]
card-rag = "card_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
